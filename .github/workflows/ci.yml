name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  merge_group:
    branches:
    - main
permissions:
  contents: read
env:
  GO_VERSION: '1.22'
jobs:
  docs:
    name: relative markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
    - name: check relative markdown links
      run: python3 scripts/check-md-links.py
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: go mod tidy is clean
      run: "go mod tidy\nif ! git diff --exit-code go.mod go.sum; then\n  echo \"\
        ::error::go.mod/go.sum differ from what 'go mod tidy' produces; run it locally\
        \ and commit the result\"\n  exit 1\nfi\n"
    - name: gofmt
      run: "unformatted=$(gofmt -l .)\nif [ -n \"$unformatted\" ]; then\n  echo \"\
        These files are not gofmt'd:\"\n  echo \"$unformatted\"\n  gofmt -d .\n  exit\
        \ 1\nfi\n"
    - name: go vet
      run: go vet ./...
    - name: go test -race with coverage
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
    - name: go build
      run: go build ./...
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - uses: golangci/golangci-lint-action@v7
      with:
        version: v2.1.6
  offline-tests:
    name: tests run with no network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: download modules
      run: go mod download
    - name: run tests with no network
      run: 'set -euo pipefail


        # Ubuntu 24.04 runners restrict unprivileged user namespaces through

        # AppArmor, so plain `unshare -rn` fails with EPERM on uid_map.

        # Lifting the restriction is preferable to running the tests under

        # sudo: as root the Go module and build caches resolve to a

        # different HOME, the warmed modules are missed, and the download

        # that follows is the very thing being blocked.

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


        unshare -rn bash -c ''ip link set lo up 2>/dev/null; go test -count=1 ./...''

        '
  verify-store:
    name: committed chain verifies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: go run ./cmd/wayfared -verify-store -data ./data
      run: go run ./cmd/wayfared -verify-store -data ./data
  docker:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: build image
      run: docker build -t wayfare:ci .
    - name: binary runs in the image
      run: docker run --rm wayfare:ci -verify-store -data /tmp/empty
    - name: report known vulnerabilities in the image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.74.0
        scan-type: image
        image-ref: wayfare:ci
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: table
        exit-code: '0'
    - name: fail on a fixable vulnerability in the image's packages
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.74.0
        scan-type: image
        image-ref: wayfare:ci
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: table
        exit-code: '1'
